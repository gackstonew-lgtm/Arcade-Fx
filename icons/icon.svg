<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Grid Lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#1E293B" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#1E293B" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="80" y1="352" x2="432" y2="352" stroke="#1E293B" stroke-width="2" stroke-dasharray="8,8"/>

  <!-- Candlesticks (SMC Bullish Expansion) -->
  <!-- Candle 1 (Bearish Sweep) -->
  <line x1="140" y1="200" x2="140" y2="380" stroke="#EF4444" stroke-width="4"/>
  <rect x="124" y="240" width="32" height="110" rx="4" fill="url(#bearGrad)"/>

  <!-- Candle 2 (Displacement Bullish) -->
  <line x1="220" y1="180" x2="220" y2="390" stroke="#10B981" stroke-width="4"/>
  <rect x="204" y="210" width="32" height="140" rx="4" fill="url(#bullGrad)"/>

  <!-- Candle 3 (Strong Institutional Breakout) -->
  <line x1="300" y1="110" x2="300" y2="330" stroke="#10B981" stroke-width="4"/>
  <rect x="284" y="130" width="32" height="170" rx="4" fill="url(#bullGrad)" filter="url(#glow)"/>

  <!-- Candle 4 (High Retest) -->
  <line x1="380" y1="90" x2="380" y2="280" stroke="#10B981" stroke-width="4"/>
  <rect x="364" y="110" width="32" height="120" rx="4" fill="url(#bullGrad)"/>

  <!-- 5AM CRT Level Line -->
  <line x1="80" y1="210" x2="432" y2="210" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Arcade FX Logo Text Overlay -->
  <text x="256" y="440" font-family="'Inter', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ARCADE FX</text>
  <text x="256" y="470" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#3B82F6" text-anchor="middle" letter-spacing="3">SMC INTELLIGENCE</text>
</svg>
