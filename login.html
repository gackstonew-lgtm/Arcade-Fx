<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade FX — In Partnership with Affiniti Group Kenya | Member Login</title>

  <!-- Centralized Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    body.auth-gateway-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--app-atmosphere);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    .auth-nav-header {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .auth-brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .auth-brand-logo img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(0, 56, 188, 0.25);
    }

    .auth-brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .auth-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .auth-form-group {
      margin-bottom: 20px;
    }

    .auth-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .auth-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-app);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .auth-input:focus {
      border-color: var(--arcade-persian-blue);
      box-shadow: 0 0 0 3px rgba(0, 56, 188, 0.15);
    }

    .auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .auth-checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-link {
      color: var(--arcade-persian-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    .auth-btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0038BC 0%, #002680 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 56, 188, 0.35);
      transition: all 0.2s ease;
    }

    .auth-btn-primary:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 8px 24px rgba(0, 56, 188, 0.5);
    }

    .auth-footer-prompt {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .auth-error-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .auth-page-footer {
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body class="auth-gateway-body">

  <!-- Header Navigation -->
  <header class="auth-nav-header">
    <a href="landing.html" class="auth-brand-logo">
      <img src="Arcade Fx logo.jpeg" alt="Arcade FX Logo">
      <div style="display: flex; flex-direction: column; line-height: 1.1;">
        <span class="auth-brand-title">Arcade Fx</span>
        <span style="font-size: 9px; font-weight: 700; color: #60A5FA; letter-spacing: 0.5px; text-transform: uppercase;">In Partnership with Affiniti Group Kenya</span>
      </div>
    </a>

    <div style="display: flex; align-items: center; gap: 12px;">
      <button id="headerThemeToggleBtn" class="btn-icon-badge" title="Toggle Theme" aria-label="Toggle Theme">
        <span id="themeToggleIcon">🌙</span>
      </button>
      <a href="landing.html" class="landing-btn-login" style="padding: 8px 16px;">← Back to Home</a>
    </div>
  </header>

  <!-- Login Gateway Form Card -->
  <main class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Member Sign In</h1>
      <p class="auth-subtitle">Access your institutional trading terminal & SMC intelligence dashboard.</p>

      <div id="authErrBox" class="auth-error-box"></div>

      <form id="loginGatewayForm">
        <div class="auth-form-group">
          <label for="loginEmail" class="auth-label">Email Address / User ID</label>
          <input type="email" id="loginEmail" class="auth-input" placeholder="trader@arcadefx.live" required autocomplete="email">
        </div>

        <div class="auth-form-group">
          <label for="loginPassword" class="auth-label">Password</label>
          <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <div class="auth-options">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember terminal session</span>
          </label>
          <a href="#" id="forgotPasswordLink" class="auth-link">Forgot password?</a>
        </div>

        <button type="submit" class="auth-btn-primary">Sign In to Workspace →</button>
      </form>

      <p class="auth-footer-prompt">
        Don't have an account? <a href="register.html" class="auth-link">Sign Up</a>
      </p>
    </div>
  </main>

  <footer class="auth-page-footer">
    © 2026 ARCADE FX — In Partnership with AFFINITI GROUP KENYA. All rights reserved.
  </footer>

  <!-- Scripts -->
  <script type="module" src="src/main.js"></script>
  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {
      // Sync theme icon
      const themeBtn = document.getElementById('headerThemeToggleBtn');
      const themeIcon = document.getElementById('themeToggleIcon');

      function syncTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (themeIcon) themeIcon.innerText = isDark ? '🌙' : '☀️';
      }

      if (themeBtn) {
        themeBtn.onclick = () => {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          const next = isDark ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try {
            const saved = JSON.parse(localStorage.getItem('arcade_settings_v1') || '{}');
            saved.theme = next;
            localStorage.setItem('arcade_settings_v1', JSON.stringify(saved));
          } catch(e) {}
          syncTheme();
        };
      }
      syncTheme();

      // Form submission handler
      const form = document.getElementById('loginGatewayForm');
      const errBox = document.getElementById('authErrBox');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value;

        if (!email || !pass) {
          errBox.innerText = 'Please provide both email and password.';
          errBox.style.display = 'block';
          return;
        }

        // Set authenticated user state in localStorage
        try {
          const session = {
            authenticated: true,
            user: { email: email, name: email.split('@')[0] || 'Trader' },
            loginTime: new Date().toISOString()
          };
          localStorage.setItem('arcade_user_session', JSON.stringify(session));
        } catch(e) {}

        // Redirect to main trading dashboard
        const targetDashboard = window.location.pathname.endsWith('.html') ? 'index.html' : 'index.html';
        window.location.href = targetDashboard;
      });
    });
  </script>
</body>
</html>
